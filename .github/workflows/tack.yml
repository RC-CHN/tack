name: Tack
on:
  push:
    branches: [master]
    tags: ["tack-v*"]
    paths: ["management/**", "transport/**", "go.mod", "go.sum", "skills/tack-deploy/**", "scripts/**", ".github/workflows/tack.yml", "share/**", "client/**", "server/**", "test/**"]
  pull_request:
    paths: ["management/**", "transport/**", "go.mod", "go.sum", "skills/tack-deploy/**", "scripts/**", ".github/workflows/tack.yml", "share/**", "client/**", "server/**", "test/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - name: Test Tack modules
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-fixture-coverage.py --require-complete
          python3 -B -m unittest discover -s scripts -p test_fixture_coverage.py
          python3 -B -m unittest discover -s scripts -p test_release_protection.py
          python3 -B -m unittest discover -s scripts -p test_transport_qualification.py
          (cd test/fixtures && go test -race -short ./... && go vet ./...)
          for module in protocol control node integration; do
            (cd "management/$module" && go test -race ./... && go vet ./...)
          done
          GOTOOLCHAIN=local go test -race ./...
          GOTOOLCHAIN=local go test -race -run '^TestSocksUDPDisconnectClosesControl$' -count=20 ./test/e2e
          GOTOOLCHAIN=local go vet ./...
      - name: Build Tack commands
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tack
          (cd management/control && go build -trimpath -o ../../build/tack/ ./cmd/tack-control ./cmd/tack)
          (cd management/node && go build -trimpath -o ../../build/tack/ ./cmd/tack-node)
  browser-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - name: Validate TLS profiles and integrated bounded shaping
        run: |
          set -eu
          (cd transport/browser && go test -race ./... && go vet ./...)
          GOTOOLCHAIN=local go test -race -tags browser ./client ./test/e2e
          GOTOOLCHAIN=local go vet -tags browser ./client
          (cd management/integration && TACK_TRAFFIC_SHAPING=bounded-v1 go test -race -count=1 -run 'Test(BlockedUploadStillDispatchesAndCancelsWithLongHeartbeat|NodeRestartResumesOutputWithoutReexecution|IdleControlOutlivesShortServerWriteTimeout|ManagementThroughImpairedTransport)$/http1' .)
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.23.12
          cache: false
      - name: Test legacy-compatible modules on the CI host
        run: |
          set -eu
          (cd management/protocol && go test ./...)
          (cd management/node && go test ./...)
          (cd test/fixtures && go test -short ./...)
      - name: Cross-compile Node targets (not native device validation)
        working-directory: management/node
        run: |
          set -eu
          mkdir -p ../../build/tack-cross
          for arch in amd64 386 arm arm64 mips mipsle mips64 mips64le; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOARM=5 GOMIPS=softfloat GOMIPS64=softfloat \
              go build -trimpath -o "../../build/tack-cross/tack-node-linux-$arch" ./cmd/tack-node
          done
          for arm in 6 7; do
            CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM="$arm" \
              go build -trimpath -o "../../build/tack-cross/tack-node-linux-armv$arm" ./cmd/tack-node
          done
          for arch in amd64 386 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" \
              go build -trimpath -o "../../build/tack-cross/tack-node-windows-$arch.exe" ./cmd/tack-node
          done
  soak:
    if: startsWith(github.ref, 'refs/tags/tack-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        http2: ["0", "1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - name: Exercise bounded tasks and reconnects without race overhead
        working-directory: management/integration
        env:
          TACK_SOAK_SECONDS: "180"
          TACK_SOAK_TASKS: "128"
          TACK_SOAK_HTTP2: ${{ matrix.http2 }}
          TACK_SOAK_REPORT: resource-report.json
        run: go test -run '^TestManagementResourceSoak$' -count=1 -timeout=8m -v .
      - uses: actions/upload-artifact@v4
        with:
          name: resource-http2-${{ matrix.http2 }}
          path: management/integration/resource-report.json
      - name: Build a separate Node without race instrumentation
        working-directory: management/node
        run: |
          mkdir -p ../../build
          go build -trimpath -o ../../build/tack-resource-node ./cmd/tack-node
      - name: Gate idle, blocked upload, outage and recovered Node footprint
        working-directory: management/integration
        env:
          TACK_NODE_BINARY: ../../build/tack-resource-node
          TACK_RESOURCE_SECONDS: "30"
          TACK_RESOURCE_MAX_OUTPUT: "1"
          TACK_RESOURCE_HTTP2: ${{ matrix.http2 }}
          TACK_RESOURCE_REPORT: footprint-report.json
        run: go test -run '^TestNodeLowFootprint$' -count=1 -timeout=8m -v .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footprint-http2-${{ matrix.http2 }}
          path: management/integration/footprint-report.json
  benchmarks:
    if: startsWith(github.ref, 'refs/tags/tack-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - name: Record verified transfers, tail latency and allocations
        env:
          GOTOOLCHAIN: local
        run: ./scripts/benchmark-fixtures.sh "$RUNNER_TEMP/tack-benchmarks" 250ms 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tack-benchmarks
          path: ${{ runner.temp }}/tack-benchmarks
  protection:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - name: Build and execute native protected artifacts
        shell: bash
        run: |
          set -euo pipefail
          profile=packed
          extra=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            profile=obfuscated
            extra+=(--without-upx)
          fi
          python3 -B scripts/install-build-tools.py --output "$RUNNER_TEMP/protection-tools" "${extra[@]}"
          python3 -B scripts/build-release.py --version 0.0.0-ci --native-only --protection "$profile" \
            --tools "$RUNNER_TEMP/protection-tools" --output "$RUNNER_TEMP/protected"
          python3 -B scripts/verify-release.py "$RUNNER_TEMP/protected" --commit "$GITHUB_SHA"
      - name: Gate the final packed Node's resources and intermittent-link recovery
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify-release.py "$RUNNER_TEMP/protected" --extract-node "$RUNNER_TEMP/protected-node" \
            --require-packed-node --extract-native "$RUNNER_TEMP/protected-bin"
          python3 -B scripts/smoke-protected.py --bin-dir "$RUNNER_TEMP/protected-bin" --report "$RUNNER_TEMP/protected-functional.json"
          export TACK_NODE_BINARY="$RUNNER_TEMP/protected-node/tack-node"
          export TACK_NODE_BUILD_RECORD="$RUNNER_TEMP/protected-node/BUILD.json"
          export GOMAXPROCS=2 TACK_RESOURCE_SECONDS=5 TACK_RESOURCE_MAX_OUTPUT=1
          export TACK_SEVERE_SECONDS=120 TACK_SEVERE_REQUIRE_COMPLETE=1
          cd management/integration
          for http2 in 0 1; do
            export TACK_RESOURCE_HTTP2="$http2"
            export TACK_RESOURCE_REPORT="$RUNNER_TEMP/protected-footprint-$http2.json"
            export TACK_SEVERE_REPORT="$RUNNER_TEMP/protected-severe-$http2.json"
            go test -run '^TestNode(LowFootprint|SevereLink)$' -count=1 -timeout=8m -v .
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protection-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/protected/manifest.json
            ${{ runner.temp }}/protected-*.json
  release:
    if: startsWith(github.ref, 'refs/tags/tack-v')
    needs: [test, legacy, soak, benchmarks, protection]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - name: Build, integrity-check, and checksum exact release archives
        run: |
          python3 -B scripts/install-build-tools.py --output "$RUNNER_TEMP/protection-tools"
          python3 -B scripts/build-release.py --version "${GITHUB_REF_NAME#tack-v}" --output dist/tack \
            --tools "$RUNNER_TEMP/protection-tools" --require-clean
          python3 -B scripts/verify-release.py dist/tack --commit "$GITHUB_SHA" --extract-node "$RUNNER_TEMP/release-node" \
            --require-packed-node --extract-native "$RUNNER_TEMP/release-bin"
          python3 -B scripts/smoke-protected.py --bin-dir "$RUNNER_TEMP/release-bin" --report "$RUNNER_TEMP/release-functional.json"
      - name: Test the exact Node included in this release
        working-directory: management/integration
        env:
          TACK_NODE_BINARY: ${{ runner.temp }}/release-node/tack-node
          TACK_NODE_BUILD_RECORD: ${{ runner.temp }}/release-node/BUILD.json
          GOMAXPROCS: "2"
          TACK_RESOURCE_SECONDS: "5"
          TACK_RESOURCE_MAX_OUTPUT: "1"
          TACK_SEVERE_SECONDS: "120"
          TACK_SEVERE_REQUIRE_COMPLETE: "1"
        run: |
          for http2 in 0 1; do
            TACK_RESOURCE_HTTP2="$http2" go test -run '^TestNode(LowFootprint|SevereLink)$' -count=1 -timeout=8m -v . || exit 1
          done
      - name: Create draft with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#tack-v}"
          args=(--draft --verify-tag --title "Tack $version" --notes-file ".github/releases/tack-$version.md")
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}" dist/tack/*
