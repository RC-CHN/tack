name: Tack
on:
  push:
    branches: [master]
    tags: ["tack-v*"]
    paths: ["cmd/**", "internal/**", "compat/**", "management/**", "transport/**", "go*.mod", "go*.sum", "skills/tack-deploy/**", "scripts/**", ".github/workflows/tack.yml", "share/**", "client/**", "server/**", "test/**"]
  pull_request:
    paths: ["cmd/**", "internal/**", "compat/**", "management/**", "transport/**", "go*.mod", "go*.sum", "skills/tack-deploy/**", "scripts/**", ".github/workflows/tack.yml", "share/**", "client/**", "server/**", "test/**"]
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional complete release rehearsal version; never creates a draft without a tag
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - name: Test Tack modules
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-fixture-coverage.py --require-complete
          python3 -B -m unittest discover -s scripts -p test_fixture_coverage.py
          python3 -B -m unittest discover -s scripts -p test_release_protection.py
          python3 -B -m unittest discover -s scripts -p test_release_matrix.py
          python3 -B -m unittest discover -s scripts -p test_transport_qualification.py
          python3 -B -m unittest discover -s scripts -p test_legacy_support.py
          (cd test/fixtures && go test -race -short ./... && go vet ./...)
          for module in protocol control node integration; do
            (cd "management/$module" && go test -race ./... && go vet ./...)
          done
          GOTOOLCHAIN=local go test -race ./...
          GOTOOLCHAIN=local go test -race -run '^TestSocksUDPDisconnectClosesControl$' -count=20 ./test/e2e
          GOTOOLCHAIN=local go vet ./...
      - name: Build Tack commands
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tack
          (cd management/control && go build -trimpath -o ../../build/tack/ ./cmd/tack)
          GOTOOLCHAIN=local go build -trimpath -o build/tack/ ./cmd/tack-node ./cmd/tack-control
  browser-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - name: Validate TLS profiles and integrated bounded shaping
        run: |
          set -eu
          (cd transport/browser && go test -race ./... && go vet ./...)
          GOTOOLCHAIN=local go test -race -tags browser ./client ./test/e2e
          GOTOOLCHAIN=local go vet -tags browser ./client
          (cd management/integration && TACK_TRAFFIC_SHAPING=bounded-v1 go test -race -count=1 -run 'Test(BlockedUploadStillDispatchesAndCancelsWithLongHeartbeat|NodeRestartResumesOutputWithoutReexecution|IdleControlOutlivesShortServerWriteTimeout|ManagementThroughImpairedTransport)$/http1' .)
  legacy:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.23.12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - name: Test unified Legacy graph and retained upstream SSH regressions
        run: |
          set -eu
          export GOTOOLCHAIN=go1.23.12
          test "$(go env GOVERSION)" = "$GOTOOLCHAIN"
          python3 -B scripts/prepare-legacy.py
          go test -mod=readonly -modfile=go.legacy.mod -race ./...
          go vet -mod=readonly -modfile=go.legacy.mod ./...
          (cd bin/legacy-deps/crypto && go test -race ./ssh ./chacha20 ./curve25519 ./internal/poly1305)
          (cd management/protocol && go test ./...)
          (cd management/node && go test ./...)
          (cd test/fixtures && go test -short ./...)
      - name: Cross-compile unified Legacy Node
        run: |
          set -eu
          export GOTOOLCHAIN=go1.23.12
          test "$(go env GOVERSION)" = "$GOTOOLCHAIN"
          mkdir -p build/tack-cross
          for arch in amd64 386 arm arm64 mips mipsle mips64 mips64le; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOARM=5 GOMIPS=softfloat GOMIPS64=softfloat \
              go build -mod=readonly -modfile=go.legacy.mod -trimpath -o "build/tack-cross/tack-node-linux-$arch" ./cmd/tack-node
          done
          for arm in 6 7; do
            CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM="$arm" \
              go build -mod=readonly -modfile=go.legacy.mod -trimpath -o "build/tack-cross/tack-node-linux-armv$arm" ./cmd/tack-node
          done
      - name: Cross-compile modern Windows Node
        run: |
          set -eu
          for arch in amd64 386 arm64; do
            GOTOOLCHAIN=go1.26.3 CGO_ENABLED=0 GOOS=windows GOARCH="$arch" \
              go build -trimpath -o "build/tack-cross/tack-node-windows-$arch.exe" ./cmd/tack-node
          done
  soak:
    if: startsWith(github.ref, 'refs/tags/tack-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        http2: ["0", "1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - name: Exercise bounded tasks and reconnects without race overhead
        working-directory: management/integration
        env:
          TACK_SOAK_SECONDS: "180"
          TACK_SOAK_TASKS: "128"
          TACK_SOAK_HTTP2: ${{ matrix.http2 }}
          TACK_SOAK_REPORT: resource-report.json
        run: go test -run '^TestManagementResourceSoak$' -count=1 -timeout=8m -v .
      - uses: actions/upload-artifact@v4
        with:
          name: resource-http2-${{ matrix.http2 }}
          path: management/integration/resource-report.json
      - name: Build the unified Node without race instrumentation
        run: |
          mkdir -p build
          GOTOOLCHAIN=local go build -trimpath -o build/tack-resource-node ./cmd/tack-node
      - name: Gate idle, blocked upload, outage and recovered Node footprint
        working-directory: management/integration
        env:
          TACK_NODE_BINARY: ../../build/tack-resource-node
          TACK_RESOURCE_SECONDS: "30"
          TACK_RESOURCE_MAX_OUTPUT: "1"
          TACK_RESOURCE_HTTP2: ${{ matrix.http2 }}
          TACK_RESOURCE_REPORT: footprint-report.json
        run: go test -run '^TestNodeLowFootprint$' -count=1 -timeout=8m -v .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footprint-http2-${{ matrix.http2 }}
          path: management/integration/footprint-report.json
  benchmarks:
    if: startsWith(github.ref, 'refs/tags/tack-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - name: Record verified transfers, tail latency and allocations
        env:
          GOTOOLCHAIN: local
        run: ./scripts/benchmark-fixtures.sh "$RUNNER_TEMP/tack-benchmarks" 250ms 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tack-benchmarks
          path: ${{ runner.temp }}/tack-benchmarks
  protection:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - name: Build and execute native protected artifacts
        shell: bash
        run: |
          set -euo pipefail
          profile=packed
          extra=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            profile=obfuscated
            extra+=(--without-upx)
          fi
          python3 -B scripts/install-build-tools.py --output "$RUNNER_TEMP/protection-tools" "${extra[@]}"
          python3 -B scripts/build-release.py --version 0.0.0-ci --native-only --protection "$profile" \
            --tools "$RUNNER_TEMP/protection-tools" --output "$RUNNER_TEMP/protected"
          python3 -B scripts/verify-release.py "$RUNNER_TEMP/protected" --commit "$GITHUB_SHA"
      - name: Gate the final packed Node's resources and intermittent-link recovery
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/verify-release.py "$RUNNER_TEMP/protected" --extract-node "$RUNNER_TEMP/protected-node" \
            --require-packed-node --extract-native "$RUNNER_TEMP/protected-bin"
          python3 -B scripts/smoke-unified.py --bin-dir "$RUNNER_TEMP/protected-bin" --report "$RUNNER_TEMP/protected-unified.json"
          export TACK_NODE_BINARY="$RUNNER_TEMP/protected-node/tack-node"
          export TACK_NODE_BUILD_RECORD="$RUNNER_TEMP/protected-node/BUILD.json"
          export GOMAXPROCS=2 TACK_RESOURCE_SECONDS=5 TACK_RESOURCE_MAX_OUTPUT=1
          export TACK_SEVERE_SECONDS=120 TACK_SEVERE_REQUIRE_COMPLETE=1
          cd management/integration
          for http2 in 0 1; do
            export TACK_RESOURCE_HTTP2="$http2"
            export TACK_RESOURCE_REPORT="$RUNNER_TEMP/protected-footprint-$http2.json"
            export TACK_SEVERE_REPORT="$RUNNER_TEMP/protected-severe-$http2.json"
            go test -run '^TestNode(LowFootprint|SevereLink)$' -count=1 -timeout=8m -v .
          done
      - name: Qualify final Legacy Node and both directions of runtime replacement
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 busybox cpio netcat-openbsd
          python3 -B scripts/qualify-legacy.py --artifacts "$RUNNER_TEMP/protected" \
            --output "$RUNNER_TEMP/legacy-qualification" --fixture-dir "$RUNNER_TEMP/legacy-vm" --download
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protection-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/protected/manifest.json
            ${{ runner.temp }}/protected-*.json
            ${{ runner.temp }}/legacy-qualification/*.json
            ${{ runner.temp }}/legacy-qualification/*.log
  release-plan:
    if: startsWith(github.ref, 'refs/tags/tack-v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.matrix.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - id: matrix
        name: Select the complete unified release matrix
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          python3 - <<'PYTHON'
          import os, re, subprocess
          version = (os.environ["GITHUB_REF_NAME"][6:] if os.environ["GITHUB_REF"].startswith("refs/tags/tack-v")
                     else os.environ["INPUT_RELEASE_VERSION"])
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?", version):
              raise SystemExit("invalid release version")
          matrix = subprocess.check_output(["python3", "-B", "scripts/release_matrix.py"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + matrix + "\nversion=" + version + "\n")
          PYTHON
      - name: Install pinned build tools once for all Linux build workers
        run: |
          set -eu
          python3 -B scripts/install-build-tools.py --output "$RUNNER_TEMP/protection-tools"
          tar -czf "$RUNNER_TEMP/tools.tar.gz" -C "$RUNNER_TEMP" protection-tools
      - uses: actions/upload-artifact@v4
        with:
          name: release-build-tools
          path: ${{ runner.temp }}/tools.tar.gz
          compression-level: 0
          retention-days: 7
  release-build:
    name: build ${{ matrix.id }}
    if: startsWith(github.ref, 'refs/tags/tack-v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: release-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.release-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go_version }}
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: release-build-tools
          path: ${{ runner.temp }}/release-build-tools
      - name: Build and verify one exact release target
        env:
          RELEASE_SHARD: ${{ matrix.id }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
        run: |
          set -eu
          tar -xzf "$RUNNER_TEMP/release-build-tools/tools.tar.gz" -C "$RUNNER_TEMP"
          python3 -B scripts/build-release.py --version "$RELEASE_VERSION" \
            --shard "$RELEASE_SHARD" --output dist/tack \
            --tools "$RUNNER_TEMP/protection-tools" --require-clean
          python3 -B scripts/verify-release.py dist/tack --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release-shard-${{ matrix.id }}
          path: dist/tack/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  release-assemble:
    if: startsWith(github.ref, 'refs/tags/tack-v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: [release-plan, release-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-shard-*
          path: ${{ runner.temp }}/release-shards
      - name: Reject missing or mixed shards and assemble exact archives
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
        run: |
          python3 -B scripts/merge-release.py --shards "$RUNNER_TEMP/release-shards" \
            --output dist/tack --commit "$GITHUB_SHA" --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/tack/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  release-modern:
    if: startsWith(github.ref, 'refs/tags/tack-v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: release-assemble
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        http2: ["0", "1"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist/tack
      - name: Verify and extract the exact final Modern artifacts
        run: |
          python3 -B scripts/verify-release.py dist/tack --commit "$GITHUB_SHA" --require-complete \
            --extract-node "$RUNNER_TEMP/release-node" --require-packed-node --extract-native "$RUNNER_TEMP/release-bin"
      - name: Exercise the final unified services and reconnect behavior
        if: matrix.http2 == '0'
        run: |
          python3 -B scripts/smoke-unified.py --bin-dir "$RUNNER_TEMP/release-bin" --report "$RUNNER_TEMP/release-unified.json"
      - name: Test the exact Node included in this release
        working-directory: management/integration
        env:
          TACK_NODE_BINARY: ${{ runner.temp }}/release-node/tack-node
          TACK_NODE_BUILD_RECORD: ${{ runner.temp }}/release-node/BUILD.json
          GOMAXPROCS: "2"
          TACK_RESOURCE_SECONDS: "5"
          TACK_RESOURCE_MAX_OUTPUT: "1"
          TACK_RESOURCE_HTTP2: ${{ matrix.http2 }}
          TACK_RESOURCE_REPORT: ${{ runner.temp }}/release-footprint.json
          TACK_SEVERE_SECONDS: "120"
          TACK_SEVERE_REQUIRE_COMPLETE: "1"
          TACK_SEVERE_REPORT: ${{ runner.temp }}/release-severe.json
        run: go test -run '^TestNode(LowFootprint|SevereLink)$' -count=1 -timeout=8m -v .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-modern-qualification-http2-${{ matrix.http2 }}
          path: ${{ runner.temp }}/release-*.json
  release-legacy:
    if: startsWith(github.ref, 'refs/tags/tack-v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: release-assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.3
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist/tack
      - name: Verify complete archives before Legacy qualification
        run: python3 -B scripts/verify-release.py dist/tack --commit "$GITHUB_SHA" --require-complete
      - name: Qualify the exact Legacy Node included in this release
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 busybox cpio netcat-openbsd
          python3 -B scripts/qualify-legacy.py --artifacts dist/tack \
            --output "$RUNNER_TEMP/release-legacy" --fixture-dir "$RUNNER_TEMP/legacy-vm" --download
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-legacy-qualification
          path: |
            ${{ runner.temp }}/release-legacy/*.json
            ${{ runner.temp }}/release-legacy/*.log
  release:
    if: startsWith(github.ref, 'refs/tags/tack-v')
    needs: [test, legacy, soak, benchmarks, protection, browser-experiment, release-modern, release-legacy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist/tack
      - name: Recheck complete verified assets without rebuilding
        run: python3 -B scripts/verify-release.py dist/tack --commit "$GITHUB_SHA" --require-complete
      - name: Create draft only after every independent gate passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#tack-v}"
          args=(--draft --verify-tag --title "Tack $version" --notes-file ".github/releases/tack-$version.md")
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}" dist/tack/*
